controller:
  resources:
    limits:
      memory: 256Mi
      cpu: 250m
    requests:
      memory: 256Mi
      cpu: 250m
# We need to use the VPC DNS resolver as CoreDNS will not be available in
# a brand new cluster without any nodes.
dnsPolicy: Default

settings:
  featureGates:
    # Enable static capacity provisioning
    StaticCapacity: true
