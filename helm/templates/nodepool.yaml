---
{{- if .Values.hlb.enabled }}
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: hlb-ami-86
spec:
  replicas: {{ .Values.replicas }}
  disruption:
    consolidateAfter: 30s
    consolidationPolicy: WhenEmptyOrUnderutilized
  template:
    spec:
      expireAfter: {{ .Values.expireAfter }}
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: hlb-ami-x86
      kubelet:
        # High threshold for Garbage Collection (GC) to prevent disk pressure (eviction usually starts at 85%)
        imageGCHighThresholdPercent: {{ .Values.imageGCHighThresholdPercent }}
        # Low threshold for GC to ensure ample space for new images
        imageGCLowThresholdPercent: {{ .Values.imageGCLowThresholdPercent }}
      requirements:
        - key: "karpenter.k8s.aws/instance-hypervisor"
          operator: In
          values: ["nitro"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand", "spot"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]
      startupTaints:
        - key: node-role.kubernetes.io/hlb
          effect: NoSchedule
{{- end }}

{{- if .Values.gravitonM8G.enabled }}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ .Values.gravitonM8G.nodepool_template_name }}
spec:
  disruption:
    consolidateAfter: 30s
    consolidationPolicy: WhenEmptyOrUnderutilized
  template:
    spec:
      expireAfter: {{ .Values.expireAfter }}
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: al2023
      kubelet:
        imageGCHighThresholdPercent: {{ .Values.imageGCHighThresholdPercent }}
        imageGCLowThresholdPercent: {{ .Values.imageGCLowThresholdPercent }}
      requirements:
        - key: "karpenter.k8s.aws/instance-hypervisor"
          operator: In
          values: ["nitro"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.k8s.aws/instance-type
          operator: In
          values: [ "{{ .Values.gravitonM8G.instanceType }}" ]
      startupTaints:
        - key: "{{ .Values.gravitonM8G.node_taintKey }}"
          effect: NoSchedule
{{- end }}
