---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: al2023
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@v20251007
  blockDeviceMappings:
    {{- range $deviceName, $config := index .Values.blockDeviceMappings "al2023" }}
    - deviceName: {{ $deviceName | quote }}
      ebs:
        deleteOnTermination: {{ default true $config.deleteOnTermination }}
        volumeSize: {{ $config.volumeSize }}
        volumeType: {{ default "gp3" $config.volumeType }}
    {{- end }}
  kubelet:
    maxPods: 110
  role: eks-node
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName }}

---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: bottlerocket
spec:
  amiFamily: Bottlerocket
  amiSelectorTerms:
    - alias: bottlerocket@1.50.0
  blockDeviceMappings:
    {{- range $deviceName, $config := index .Values.blockDeviceMappings "bottlerocket" }}
    - deviceName: {{ $deviceName | quote }}
      ebs:
        deleteOnTermination: {{ default true $config.deleteOnTermination }}
        volumeSize: {{ $config.volumeSize }}
        volumeType: {{ default "gp3" $config.volumeType }}
    {{- end }}
  kubelet:
    maxPods: 110
  role: eks-node
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName }}

---
# HLB hlb-ami node class using HLB custom AMI
{{- if .Values.hlb.enabled }}
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: hlb-ami
spec:
  # We use AL2 amiFamily so Karpenter generates EKS bootstrap userdata
  amiFamily: AL2
  amiSelectorTerms:
    - id: "{{ .Values.hlb.amiId }}"  # passed from Terraform
  blockDeviceMappings:
    {{- range $deviceName, $config := index .Values.blockDeviceMappings "hlb-ami" }}
    - deviceName: {{ $deviceName | quote }}
      ebs:
        deleteOnTermination: {{ default true $config.deleteOnTermination }}
        volumeSize: {{ $config.volumeSize }}
        volumeType: {{ default "gp3" $config.volumeType }}
    {{- end }}
  kubelet:
    maxPods: 110
  role: eks-node
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName }}
{{- end }}
