{{- range .Values.ec2NodeClasses }}
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: {{ .name }}
spec:
  amiFamily: {{ .ami_family }}
  {{- if .ami_selector_terms }}
  amiSelectorTerms:
    {{- toYaml .ami_selector_terms | nindent 4 }}
  {{- end }}
  role: {{ .role | default "eks-node" }}
  subnetSelectorTerms:
    {{- toYaml .subnet_selector_terms | nindent 4 }}
  securityGroupSelectorTerms:
    {{- toYaml .security_group_selector_terms | nindent 4 }}
  {{- with .metadata_options }}
  metadataOptions:
    httpEndpoint: {{ .httpEndpoint | default "enabled" }}
    httpProtocolIPv6: {{ .httpProtocolIPv6 | default "disabled" }}
    httpPutResponseHopLimit: {{ .httpPutResponseHopLimit | default 2 }}
    httpTokens: {{ .httpTokens | default "required" }}
  {{- end }}
  {{- if .block_device_mappings }}
  blockDeviceMappings:
    {{- range .block_device_mappings }}
    - deviceName: {{ .deviceName }}
      ebs:
        volumeSize: {{ .ebs.volumeSize }}
        volumeType: {{ .ebs.volumeType | default "gp3" }}
        encrypted: {{ .ebs.encrypted | default true }}
        deleteOnTermination: {{ .ebs.deleteOnTermination | default true }}
    {{- end }}
  {{- end }}
  {{- if .tags }}
  tags:
    {{- toYaml .tags | nindent 4 }}
  {{- end }}
{{- end }}
