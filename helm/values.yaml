---
allowedArch:
  - amd64
blockDeviceMappings:
  al2023:
    /dev/xvda:
      volumeSize: 40Gi
      volumeType: gp3
  bottlerocket:
    /dev/xvda:
      volumeSize: 8Gi
      volumeType: gp3
    /dev/xvdb:
      volumeSize: 40Gi
      volumeType: gp3

excludedInstanceSizes:
  - nano
  - micro
  - small
  - medium

# Prefer Bottlerocket over AL2023 by assigning a higher weight
nodePoolWeight:
  al2023: 10
  bottlerocket: 20

nodePools: {}

consolidateAfter: 120s

al2023:
  enabled: true
  topologySpreadConstraints: []
  extraRequirements: []
bottlerocket:
  enabled: true
  topologySpreadConstraints: []
  extraRequirements: []

al2023UserData: ""
bottlerocketUserData: ""

# Portability & customization variables
nodeIamRoleName: eks-node
subnetSelectorTerms: null
securityGroupSelectorTerms: null
al2023AmiSelectorTerms: null
bottlerocketAmiSelectorTerms: null
kubeletMaxPods: 110
metadataOptions:
  httpEndpoint: enabled
  httpProtocolIPv6: disabled
  httpPutResponseHopLimit: 2
  httpTokens: required

replicas: 1
