---
awsAccountId: ""
awsRegion: ""
clusterName: ""
oidcProvider: ""

# Block device mappings for different AMI families
blockDeviceMappings:
  al2023:
    /dev/xvda:
      volumeSize: 40Gi
      volumeType: gp3
  bottlerocket:
    /dev/xvda:
      volumeSize: 8Gi
      volumeType: gp3
    /dev/xvdb:
      volumeSize: 40Gi
      volumeType: gp3

# Kubelet image garbage collection settings
imageGCHighThresholdPercent: 85
imageGCLowThresholdPercent: 80

# Excluded instance sizes (optional)
excludedInstanceSizes: []

# Static mode configuration - Set to 1 to enable static mode with a fixed number of nodes
replicas: 1

# Maximum nodes during scaling/drift for static NodePools
limitsNodes: 2
