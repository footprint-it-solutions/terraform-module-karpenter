---
# Default Karpenter global settings
expireAfter: 168h
imageGCHighThresholdPercent: 70
imageGCLowThresholdPercent: 50

# Dynamic NodePool and EC2NodeClass configuration
nodePools: {}
nodeClasses: {}

allowedArch:
  - amd64
blockDeviceMappings:
  al2023:
    /dev/xvda:
      volumeSize: 40Gi
      volumeType: gp3
  bottlerocket:
    /dev/xvda:
      volumeSize: 8Gi
      volumeType: gp3
    /dev/xvdb:
      volumeSize: 40Gi
      volumeType: gp3

excludedInstanceSizes:
  - nano
  - micro
  - small
  - medium

# Prefer Bottlerocket over AL2023 by assigning a higher weight
nodePoolWeight:
  al2023: 10
  bottlerocket: 20

consolidateAfter: 120s

al2023:
  enabled: true
  topologySpreadConstraints: []
  extraRequirements: []
bottlerocket:
  enabled: true
  topologySpreadConstraints: []
  extraRequirements: []

al2023UserData: ""
bottlerocketUserData: ""

replicas: 1
