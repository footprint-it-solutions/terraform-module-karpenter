---
blockDeviceMappings:
  al2023:
    /dev/xvda:
      volumeType: gp3
  bottlerocket:
    /dev/xvda:
      volumeSize: 8Gi
      volumeType: gp3
    /dev/xvdb:
      volumeSize: 40Gi
      volumeType: gp3

excludedInstanceSizes:
  - nano
  - micro
  - small
  - medium

# Prefer Bottlerocket over AL2023 by assigning a higher weight
nodePoolWeight:
  al2023: 10
  bottlerocket: 20
